name: Playwright UI and API Automation

# Workflow triggers
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Run manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: UI AUTOMATION
  ui-tests:

    name: UI Automation Tests
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create output folders
        run: mkdir -p reports logs

      - name: Execute UI tests
        run: |
          python -m pytest -v ui_tests/ \
          --html=reports/ui-report.html \
          --self-contained-html

      - name: Upload UI test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            reports/ui-report.html
            test-results/
            logs/automation.log
          if-no-files-found: warn
          retention-days: 7


  # JOB 2: API AUTOMATION
  api-tests:

    name: API Automation Tests
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create output folders
        run: mkdir -p reports logs

      - name: Execute API tests
        run: |
          python -m pytest -v api_tests/ \
          --html=reports/api-report.html \
          --self-contained-html

      - name: Upload API test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: |
            reports/api-report.html
            test-results/
            logs/automation.log
          if-no-files-found: warn
          retention-days: 7
